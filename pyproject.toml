[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "influxdb3-ref-iiot"
version = "0.1.0"
description = "Reference architecture: InfluxDB 3 Enterprise for IIoT / factory floor monitoring"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "influxdb3-python>=0.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "testcontainers>=4.0",
  "ruff>=0.4",
  "freezegun>=1.4",
]

[tool.setuptools.packages.find]
include = ["simulator*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "scenario: tier-2 scenario tests requiring Docker",
  "smoke: tier-3 smoke test running the full make up flow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Plugins run inside the InfluxDB 3 Processing Engine, which injects
# `LineBuilder` (and `influxdb3_local`) into module globals at runtime.
# We do NOT import them, so silence F821 here. We also keep multi-line SQL
# strings readable rather than wrapping them just to satisfy E501.
"plugins/*.py" = ["F821", "E501"]
# Inline SQL in helper modules and tests is more readable on one line.
"ui/queries.py" = ["E501"]
"tests/**/*.py" = ["E501", "E741"]
"simulator/scenarios/*.py" = ["E501"]
